services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    volumes:
      - ..:/workspaces/condominio:cached
    command: sleep infinity
    environment:
      - REDIS_HOST=redis

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
