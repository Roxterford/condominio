schema {
  query: Query
  mutation: Mutation
}

directive @autofilter on INPUT_OBJECT

"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
  """Deferred when true or undefined."""
  if: Boolean = true
  """Unique name"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

directive @paginable on OBJECT

input BooleanCondition {
  eq: Boolean
}

interface Cuota {
  actualizacion: DateTime!
  anio: Int!
  id: ID!
  mes: Int!
  monto: Float!
  recaudacion: Recaudacion!
  registro: DateTime!
}

type CuotaEspecial implements Cuota {
  actualizacion: DateTime!
  anio: Int!
  detalles: Proyecto!
  id: ID!
  mes: Int!
  monto: Float!
  recaudacion: Recaudacion!
  registro: DateTime!
}

input CuotaFilter {
  and: [CuotaFilter!]
  id: StringCondition
  monto: IntCondition
  not: CuotaFilter
  or: [CuotaFilter!]
}

type CuotaRegular implements Cuota {
  actualizacion: DateTime!
  anio: Int!
  id: ID!
  mes: Int!
  monto: Float!
  recaudacion: Recaudacion!
  registro: DateTime!
}

union CuotaType = CuotaEspecial | CuotaRegular

scalar DateTime

enum EstadoDeProyecto {
  ACTIVO
  BORRADOR
  CERRADO
}

type Gasto {
  concepto: String!
  cuota: ID
  descripcion: String
  fecha: DateTime!
  id: ID!
  moneda: String!
  monto: Int!
  proveedor: String!
  registrado_por: String!
  registro: DateTime!
  tasa: Int!
  total: Int!
}

type GastoWithProveedor {
  concepto: String!
  cuota: ID
  descripcion: String
  fecha: DateTime!
  id: ID!
  moneda: Moneda!
  monto: Int!
  proveedor: Proveedor!
  registrado_por: String!
  registro: DateTime!
  tasa: Int!
  total: Int!
}

input IntCondition {
  eq: Int
  gt: Int
  gte: Int
  lt: Int
  lte: Int
}

type LoginCredentialsDTO {
  token: String!
}

enum MetodoDePago {
  Efectivo
  PagoMovil
  Transferencia
}

enum Moneda {
  USD
  VED
}

type Mutation {
  _empty: String
  login(email: String!, password: String!): LoginCredentialsDTO!
  registrarGasto(input: RegistrarGastoDTO!): Gasto!
  registrarGastoYProveedor(input: RegistrarGastoYProveedorDTO!): Gasto!
  registrarPago(input: RegistrarPagoDTO!): Boolean!
}

input ObtenerProveedoresDTO {
  and: [ObtenerProveedoresDTO!]
  id: StringCondition
  not: ObtenerProveedoresDTO
  or: [ObtenerProveedoresDTO!]
}

union Paginable = Gasto

type Paginated {
  data: [Paginable!]!
  limit: Int!
  page: Int!
  pages: Int!
  total: Int!
}

type PaginatedCuota {
  data: [CuotaType!]!
  limit: Int!
  page: Int!
  pages: Int!
  total: Int!
}

type PaginatedGasto {
  data: [Gasto!]!
  limit: Int!
  page: Int!
  pages: Int!
  total: Int!
}

type PaginatedGastoWithProveedor {
  data: [GastoWithProveedor!]!
  limit: Int!
  page: Int!
  pages: Int!
  total: Int!
}

input Paginator {
  limit: Int!
  page: Int!
}

type Pago {
  actualizacion: DateTime!
  actualizado_por: String!
  cuenta: Int!
  destinado: Int!
  fecha: DateTime!
  id: String!
  metodo: MetodoDePago!
  moneda: Moneda!
  monto: Int!
  referencia: String!
  registrado_por: String!
  registro: DateTime!
  tasa: Int!
  villa: Int!
}

type Proveedor {
  actualizado_en: DateTime!
  creado_en: DateTime!
  direccion: String
  email: String
  id: ID!
  nombre: String!
  rif: String!
  telefono: String
}

type Proyecto {
  actualizacion: DateTime!
  descripcion: String!
  estado: EstadoDeProyecto!
  fecha_limite: DateTime!
  interes_por_mora: Float!
  justificacion: String!
  registro: DateTime!
  titulo: String!
}

type Query {
  _empty: String
  obtenerCuota(id: String!): CuotaType
  obtenerCuotas(filter: CuotaFilter, paginator: Paginator): PaginatedCuota!
  obtenerGastos(paginator: Paginator): PaginatedGastoWithProveedor!
  obtenerProveedores(filter: ObtenerProveedoresDTO): [Proveedor!]!
  obtenerTasa: Tasa!
  obtenerVillasTotales: VillasTotales
}

type Recaudacion {
  moneda: Moneda!
  monto_estimado: Float!
  monto_pendiente: Float!
  monto_recaudado: Float!
  pagos_asociados: Int!
  villas: Int!
  villas_aplicadas: Int!
  villas_pendientes: Int!
  villas_solventes: Int!
}

input RegistrarGastoDTO {
  concepto: String!
  fecha: DateTime
  moneda: Moneda!
  monto: Int!
  proveedor: String!
}

input RegistrarGastoYProveedorDTO {
  concepto: String!
  fecha: DateTime
  moneda: Moneda!
  monto: Int!
  proveedor: RegistrarProveedorDTO!
}

input RegistrarPagoDTO {
  fecha: DateTime
  metodo: MetodoDePago!
  moneda: Moneda!
  monto: Int!
  referencia: String!
  tasa: Int!
  villa: Int!
}

input RegistrarProveedorDTO {
  direccion: String
  email: String!
  nombre: String!
  rif: String!
  telefono: String!
}

input StringCondition {
  eq: String
  in: [String]
  like: String
  regex: String
}

type Tasa {
  fecha: String!
  fuente: String!
  moneda: String!
  tipo: String!
  valor: Int!
}

enum TipoDeCuota {
  Especial
  Regular
  Semilla
}

type VillasTotales {
  total_asignado: Float!
  total_pendiente: Float!
  total_villas: Int!
  villas_activas: Int!
  villas_con_pendientes: Int!
  villas_en_litigio: Int!
  villas_exentas: Int!
  villas_inhabitadas: Int!
  villas_preventa: Int!
  villas_solventes: Int!
  villas_suspendidas: Int!
}