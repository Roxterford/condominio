layer: "application"
language: "go"
stack: "backend"

tasks:
  serve:
    command: "go tool air"
    options:
      envFile: "/.env"
  
  codegen:
    script: "go run ./internal/tools/autopaginated && go run github.com/99designs/gqlgen generate"
    inputs:
      - "./graph/*.graphqls"
      - "./internal/**/*.graphqls"
      - "./internal/tools/autopaginated/*.go"
      - "./gqlgen.yml"

  test:
    command: "go test ./..."
    inputs:
      - "./**/*.go"
