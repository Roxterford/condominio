layer: "application"
language: "go"
stack: "backend"

tasks:
  serve:
    command: "go tool air"
    options:
      envFile: "/.env"
  
  codegen:
    command: "go run github.com/99designs/gqlgen generate"
    inputs:
      - "./graph/*.graphqls"
      - "./internal/**/*.graphqls"

  test:
    command: "go test ./..."
    inputs:
      - "./**/*.go"
