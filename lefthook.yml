# Validate commit messages
commit-msg:
  commands:
    "lint commit message":
      run: bunx commitlint --edit {1}
# pre-push:
#   jobs:
#     - name: packages audit
#       tags:
#         - frontend
#         - security
#       run: yarn audit
#
#     - name: gems audit
#       tags:
#         - backend
#         - security
#       run: bundle audit
#
pre-commit:
  #   parallel: true
  jobs:
    - name: golines
      glob: "*.go"
      # {staged_files} pasa solo los archivos que vas a committear
      # -w indica a golines que sobrescriba los archivos con los cambios
      run: |
        command -v golines >/dev/null 2>&1 || exit 0
        echo "Aplicando golines a los siguientes archivos:"
        for file in {staged_files}; do echo "- $file"; done
        golines -w {staged_files}
      # Esta opción hace el 'git add' automático de los archivos modificados
      stage_fixed: true

    - name: "moon-test"
      run: command -v moon >/dev/null 2>&1 && moon run :test --affected || true

